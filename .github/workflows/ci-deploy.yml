name: Tests and build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: razryad-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci --registry=https://registry.npmjs.org && npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: python -m pytest -q
        working-directory: backend
        env:
          DEV_MODE: 'true'
      - name: Check migrations on an empty database
        run: alembic upgrade head && alembic check
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/razryad-ci-migrations.db
      - name: Package tested release
        run: tar --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' -czf release.tar.gz backend frontend/dist content
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 7
